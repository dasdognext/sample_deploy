version: 0.2

env:
  parameter-store:
    LAMBDA: "/gnextlabs/lambda/dev/LAMBDA_AUTH_SERVICE"
    LAMBDA_REGION: "/gnextlabs/lambda/dev/LAMBDA_REGION"
    SECRET_KEY_LAMBDA_AUTH: "/gnextlabs/back/dev/SECRET_KEY_LAMBDA_AUTH"
    AWS_ACCOUNT_ID: "/gnextlabs/back/dev/AWS_ACCOUNT_ID"
    API_GATEWAY_REGION: "/gnextlabs/back/dev/API_GATEWAY_REGION"
    API_GATEWAY_ID: "/gnextlabs/back/dev/API_GATEWAY_ID"
    API_GATEWAY_API_KEY_TEST: "/gnextlabs/back/dev/API_GATEWAY_API_KEY_TEST"
  variables:
    ENVIRONMENT: "dev"

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      # Install AWS SAM CLI for remote testing
      - pip install aws-sam-cli
      # Install jq for JSON parsing (if not already available)
      - |
        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          if command -v yum &> /dev/null; then
            sudo yum install -y jq
          elif command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          else
            echo "Warning: Could not install jq automatically. Please ensure it's available."
          fi
        else
          echo "jq is already installed"
        fi
      - pip install -r cicd/requirements.txt
      - pip install pytest>=7.4.0 moto>=4.2.0
  pre_build:
    commands:
      - echo "Running unit tests..."
      - export PYTHONPATH=$CODEBUILD_SRC_DIR/src:$CODEBUILD_SRC_DIR/cicd/layer:$PYTHONPATH
      - pytest cicd/test/ -v --tb=short
  build:
    commands:
      # Setup rollback manager
      - chmod +x $CODEBUILD_SRC_DIR/cicd/rollback-manager.sh
      - ROLLBACK_SCRIPT="$CODEBUILD_SRC_DIR/cicd/rollback-manager.sh"
      - LAMBDA_FUNCTION_NAME=$(echo $LAMBDA | sed 's/.*function:\([^:]*\).*/\1/')
      # Get the latest published Lambda version (deployed by PR build)
      - |
        echo "============================================"
        echo "MERGE BUILD - Promoting latest version to live alias"
        echo "============================================"
        echo ""
        echo "Getting latest published Lambda version..."
        LATEST_VERSION=$(aws lambda list-versions-by-function \
          --function-name $LAMBDA_FUNCTION_NAME \
          --region $LAMBDA_REGION \
          --query 'Versions[?Version!=`$LATEST`].Version' \
          --output text | tr '\t' '\n' | sort -n | tail -1)
        
        if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" == "None" ]; then
          echo "ERROR: No published version found!"
          exit 1
        fi
        
        echo "Latest published version: $LATEST_VERSION"
        
        # Get current stable version for reference
        export LAMBDA="$LAMBDA"
        export LAMBDA_REGION="$LAMBDA_REGION"
        export ENVIRONMENT="$ENVIRONMENT"
        CURRENT_STABLE=$($ROLLBACK_SCRIPT get-stable)
        echo "Current stable version: $CURRENT_STABLE"
        
        # Get current alias version
        CURRENT_ALIAS=$($ROLLBACK_SCRIPT get-alias)
        echo "Current alias points to: $CURRENT_ALIAS"
      # Update alias to point to the latest version
      - |
        echo ""
        echo "Updating alias 'live' to point to version $LATEST_VERSION..."
        
        # Update or create the alias
        aws lambda update-alias \
          --function-name $LAMBDA_FUNCTION_NAME \
          --name "live" \
          --function-version "$LATEST_VERSION" \
          --region $LAMBDA_REGION 2>/dev/null || \
        aws lambda create-alias \
          --function-name $LAMBDA_FUNCTION_NAME \
          --name "live" \
          --function-version "$LATEST_VERSION" \
          --description "Production alias managed by CI/CD" \
          --region $LAMBDA_REGION
        
        echo "Alias updated successfully!"
        sleep 5
      # Execute CI test events against the live alias with rollback support
      - echo "Executing CI test events against live alias..."
      - chmod +x $CODEBUILD_SRC_DIR/cicd/test/run-ci-test-events.sh
      - cd $CODEBUILD_SRC_DIR
      - |
        # Export variables for rollback script
        export LAMBDA="$LAMBDA"
        export LAMBDA_REGION="$LAMBDA_REGION"
        export ENVIRONMENT="$ENVIRONMENT"
        ROLLBACK_SCRIPT="$CODEBUILD_SRC_DIR/cicd/rollback-manager.sh"
        
        # Run tests and handle rollback on failure
        if $CODEBUILD_SRC_DIR/cicd/test/run-ci-test-events.sh; then
          echo "All tests passed! Updating stable version..."
          $ROLLBACK_SCRIPT update-stable
          if [ $? -eq 0 ]; then
            echo "============================================"
            echo "SUCCESS: Version $LATEST_VERSION is now live and stable!"
            echo "============================================"
          else
            echo "WARNING: Failed to update stable version!"
            exit 1
          fi
        else
          echo "Tests failed! Initiating rollback..."
          STABLE_VERSION=$($ROLLBACK_SCRIPT get-stable)
          if [ "$STABLE_VERSION" != "NO_STABLE_VERSION" ] && [ -n "$STABLE_VERSION" ]; then
            echo "Rolling back alias to stable version: $STABLE_VERSION"
            $ROLLBACK_SCRIPT rollback
            echo "============================================"
            echo "ROLLBACK COMPLETE"
            echo "Alias 'live' rolled back to version: $STABLE_VERSION"
            echo "Failing build due to test failures."
            echo "============================================"
          else
            echo "No stable version available for rollback. This may be the first deployment."
            echo "Failing build due to test failures."
          fi
          exit 1
        fi
