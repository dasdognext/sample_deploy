version: 0.2

env:
  parameter-store:
    LAMBDA: "/gnextlabs/lambda/dev/LAMBDA_AUTH_SERVICE"
    LAMBDA_REGION: "/gnextlabs/lambda/dev/LAMBDA_REGION"
    SECRET_KEY_LAMBDA_AUTH: "/gnextlabs/back/dev/SECRET_KEY_LAMBDA_AUTH"
    AWS_ACCOUNT_ID: "/gnextlabs/back/dev/AWS_ACCOUNT_ID"
    API_GATEWAY_REGION: "/gnextlabs/back/dev/API_GATEWAY_REGION"
    API_GATEWAY_ID: "/gnextlabs/back/dev/API_GATEWAY_ID"
    API_GATEWAY_API_KEY_TEST: "/gnextlabs/back/dev/API_GATEWAY_API_KEY_TEST"
  variables:
    ENVIRONMENT: "dev"

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      # Install AWS SAM CLI for remote testing
      - pip install aws-sam-cli
      # Install jq for JSON parsing (if not already available)
      - |
        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          if command -v yum &> /dev/null; then
            sudo yum install -y jq
          elif command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          else
            echo "Warning: Could not install jq automatically. Please ensure it's available."
          fi
        else
          echo "jq is already installed"
        fi
      - pip install -r cicd/requirements.txt
      - pip install pytest>=7.4.0 moto>=4.2.0
  pre_build:
    commands:
      - echo "Running unit tests..."
      - export PYTHONPATH=$CODEBUILD_SRC_DIR/src:$CODEBUILD_SRC_DIR/cicd/layer:$PYTHONPATH
      - pytest cicd/test/ -v --tb=short
  build:
    commands:
      # Manage Lambda Layer
      - chmod +x $CODEBUILD_SRC_DIR/cicd/layer/layer-manager.sh
      - |
        if [ -f $CODEBUILD_SRC_DIR/cicd/layer/layer-custom.sh ]; then
          chmod +x $CODEBUILD_SRC_DIR/cicd/layer/layer-custom.sh
        fi
      - |
        export ENVIRONMENT="dev"
        $CODEBUILD_SRC_DIR/cicd/layer/layer-manager.sh
      - LAMBDA_FUNCTION_NAME=$(echo $LAMBDA | sed 's/.*function:\([^:]*\).*/\1/')
      - LAYER_NAME="${LAMBDA_FUNCTION_NAME}-LAYER"
      - LAYER_ARN=$(aws ssm get-parameter --name "/gnextlabs/lambda/dev/${LAYER_NAME}_ARN" --region $LAMBDA_REGION --query 'Parameter.Value' --output text)
      # Building Lambda
      # Note: packages.txt is generated by layer-manager.sh
      - echo "Building Lambda"
      - cd $CODEBUILD_SRC_DIR/src
      - zip -r lambda.zip ./ #index.py
      # Update function configuration (layers and environment variables)
      - aws lambda update-function-configuration --function-name $LAMBDA --layers $LAYER_ARN --environment "Variables={SECRET_KEY_LAMBDA_AUTH=\"$SECRET_KEY_LAMBDA_AUTH\"}"
      - sleep 10
      # Deploy new code and publish a new version
      - aws lambda update-function-code --function-name $LAMBDA --zip-file 'fileb://lambda.zip' --publish --region=$LAMBDA_REGION
      - sleep 15
      # Get the latest published version for testing
      - cd $CODEBUILD_SRC_DIR
      - |
        echo "Getting latest published Lambda version..."
        LATEST_VERSION=$(aws lambda list-versions-by-function \
          --function-name $LAMBDA_FUNCTION_NAME \
          --region $LAMBDA_REGION \
          --query 'Versions[?Version!=`$LATEST`].Version' \
          --output text | tr '\t' '\n' | sort -n | tail -1)
        echo "Latest published version: $LATEST_VERSION"
        
        # Build Lambda ARN with specific version for testing
        LAMBDA_VERSION_ARN="${LAMBDA}:${LATEST_VERSION}"
        echo "Testing against version ARN: $LAMBDA_VERSION_ARN"
        
        # Override LAMBDA variable to test the specific version (not the alias)
        export LAMBDA="$LAMBDA_VERSION_ARN"
      # Execute CI test events against the new version (without changing alias)
      - echo "Executing CI test events against new version..."
      - chmod +x $CODEBUILD_SRC_DIR/cicd/test/run-ci-test-events.sh
      - |
        # Run tests against the specific version
        if $CODEBUILD_SRC_DIR/cicd/test/run-ci-test-events.sh; then
          echo "============================================"
          echo "All tests passed on the new version!"
          echo "Code has been deployed but alias NOT updated."
          echo "Merge to main branch to promote this version to the live alias."
          echo "============================================"
        else
          echo "============================================"
          echo "Tests failed on the new version!"
          echo "The new code has been deployed but is NOT live."
          echo "The alias still points to the previous stable version."
          echo "Fix the issues and create a new PR."
          echo "============================================"
          exit 1
        fi
