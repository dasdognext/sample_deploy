version: 0.2

env:
  parameter-store:
    LAMBDA: "/gnextlabs/lambda/test/LAMBDA_AUTH_SERVICE"
    LAMBDA_REGION: "/gnextlabs/lambda/test/LAMBDA_REGION"
    SECRET_KEY_LAMBDA_AUTH: "/gnextlabs/back/test/SECRET_KEY_LAMBDA_AUTH"
    AWS_ACCOUNT_ID: "/gnextlabs/back/test/AWS_ACCOUNT_ID"
    API_GATEWAY_REGION: "/gnextlabs/back/test/API_GATEWAY_REGION"
    API_GATEWAY_ID: "/gnextlabs/back/test/API_GATEWAY_ID"
    API_GATEWAY_API_KEY_TEST: "/gnextlabs/back/test/API_GATEWAY_API_KEY_TEST"
  variables:
    ENVIRONMENT: "test"

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      # Install AWS SAM CLI for remote testing
      - pip install aws-sam-cli
      # Install jq for JSON parsing (if not already available)
      - |
        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          if command -v yum &> /dev/null; then
            sudo yum install -y jq
          elif command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          else
            echo "Warning: Could not install jq automatically. Please ensure it's available."
          fi
        else
          echo "jq is already installed"
        fi
      - pip install -r cicd/requirements.txt
      - pip install pytest>=7.4.0 moto>=4.2.0
  pre_build:
    commands:
      - echo "Running unit tests..."
      - export PYTHONPATH=$CODEBUILD_SRC_DIR/src:$CODEBUILD_SRC_DIR/cicd/layer:$PYTHONPATH
      - pytest cicd/test/ -v --tb=short
  build:
    commands:
      # Manage Lambda Layer
      - chmod +x $CODEBUILD_SRC_DIR/cicd/layer/layer-manager.sh
      - |
        if [ -f $CODEBUILD_SRC_DIR/cicd/layer/layer-custom.sh ]; then
          chmod +x $CODEBUILD_SRC_DIR/cicd/layer/layer-custom.sh
        fi
      - |
        export ENVIRONMENT="test"
        $CODEBUILD_SRC_DIR/cicd/layer/layer-manager.sh
      - LAMBDA_FUNCTION_NAME=$(echo $LAMBDA | sed 's/.*function:\([^:]*\).*/\1/')
      - LAYER_NAME="${LAMBDA_FUNCTION_NAME}-LAYER"
      - LAYER_ARN=$(aws ssm get-parameter --name "/gnextlabs/lambda/test/${LAYER_NAME}_ARN" --region $LAMBDA_REGION --query 'Parameter.Value' --output text)
      # Setup rollback manager
      - chmod +x $CODEBUILD_SRC_DIR/cicd/rollback-manager.sh
      # Building Lambda
      # Note: packages.txt is generated by layer-manager.sh
      - echo "Building Lambda"
      - cd $CODEBUILD_SRC_DIR/src
      - zip -r lambda.zip ./ #index.py
      - aws lambda update-function-configuration --function-name $LAMBDA --layers $LAYER_ARN --environment "Variables={SECRET_KEY_LAMBDA_AUTH=\"$SECRET_KEY_LAMBDA_AUTH\"}"
      - sleep 10
      - aws lambda update-function-code --function-name $LAMBDA --zip-file 'fileb://lambda.zip' --publish --region=$LAMBDA_REGION
      - sleep 15
      # Execute CI test events with rollback support
      - echo "Executing CI test events..."
      - chmod +x $CODEBUILD_SRC_DIR/cicd/test/run-ci-test-events.sh
      - cd $CODEBUILD_SRC_DIR
      - |
        # Export variables for rollback script
        export LAMBDA="$LAMBDA"
        export LAMBDA_REGION="$LAMBDA_REGION"
        export ENVIRONMENT="$ENVIRONMENT"
        ROLLBACK_SCRIPT="$CODEBUILD_SRC_DIR/cicd/rollback-manager.sh"
        
        # Run tests and handle rollback on failure
        if $CODEBUILD_SRC_DIR/cicd/test/run-ci-test-events.sh; then
          echo "All tests passed! Updating stable version..."
          $ROLLBACK_SCRIPT update-stable
          if [ $? -eq 0 ]; then
            echo "Stable version updated successfully."
          else
            echo "WARNING: Failed to update stable version!"
            exit 1
          fi
        else
          echo "Tests failed! Initiating rollback..."
          STABLE_VERSION=$($ROLLBACK_SCRIPT get-stable)
          if [ "$STABLE_VERSION" != "NO_STABLE_VERSION" ] && [ -n "$STABLE_VERSION" ]; then
            echo "Rolling back to stable version: $STABLE_VERSION"
            $ROLLBACK_SCRIPT rollback
            echo "Rollback completed. Failing build due to test failures."
          else
            echo "No stable version available for rollback. This may be the first deployment."
            echo "Failing build due to test failures."
          fi
          exit 1
        fi
